<!DOCTYPE html>
<html lang="tet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee Istória - Biblioteka Dijitál</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           1. 스타일 변수 (라이트 모드 & 야간 독서 모드 지원)
           ========================================================================== */
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --accent-color: #2563eb;
            --bg-body: #f1f5f9;
            --bg-paper: #ffffff;
            --bg-toolbar: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #e2e8f0;
            --base-font-size: 18px;
        }

        body.dark-mode {
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --accent-color: #60a5fa;
            --bg-body: #0f172a;
            --bg-paper: #1e293b;
            --bg-toolbar: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s, color 0.25s;
        }

        /* ==========================================================================
           2. 상단 헤더 (로고 크기 고정 및 출판사별 동적 지원)
           ========================================================================== */
        header {
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 0.65rem 1.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            overflow: hidden;
        }

        .header-pub-logo {
            height: 34px !important;
            max-height: 34px !important;
            width: auto !important;
            max-width: 110px !important;
            object-fit: contain;
            border-radius: 6px;
            background-color: #ffffff;
            padding: 2px 4px;
            flex-shrink: 0;
            display: block;
        }

        .brand-title span#headerBookTitle {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-badge {
            font-size: 0.72rem;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .back-library-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 0.4rem 0.95rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .back-library-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        /* ==========================================================================
           3. 상단 컨트롤 툴바
           ========================================================================== */
        .story-toolbar {
            background-color: var(--bg-toolbar);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 0.55rem 1.5rem;
            flex-shrink: 0;
        }

        .toolbar-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.65rem;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .scene-select {
            padding: 0.4rem 0.8rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-paper);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            max-width: 230px;
        }

        .scene-select:focus {
            border-color: var(--accent-color);
        }

        /* 성경 인물 선택 드롭다운 강조 스타일 */
        .char-select {
            border-color: var(--primary-color);
            background-color: #eff6ff;
            color: #1e3a8a;
        }

        body.dark-mode .char-select {
            background-color: #0f172a;
            color: #60a5fa;
        }

        .lang-group {
            display: inline-flex;
            background-color: var(--bg-body);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            padding: 0.3rem 0.75rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .tools-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tool-btn {
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-paper);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .tool-btn.print-wb-btn {
            background-color: #ea580c;
            border-color: #ea580c;
            color: #ffffff;
        }

        .tool-btn.print-wb-btn:hover {
            background-color: #c2410c;
            color: #ffffff;
        }

        /* ==========================================================================
           4. 동화책 뷰어 (노트북: 좌우 2단 펼침 + 블러 액자 프레임)
           ========================================================================== */
        main {
            max-width: 1280px;
            margin: 1rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .story-book-card {
            background-color: var(--bg-paper);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 5px;
            background-color: var(--border-color);
            flex-shrink: 0;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 16.6%;
            transition: width 0.3s ease;
        }

        .book-spread-layout {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            flex: 1;
            min-height: 0;
        }

        /* 성경 인물 마지막 슬라이드(생각 정리 & 생활 적용) 전용 전체 1단 레이아웃 */
        .book-spread-layout.reflection-mode {
            grid-template-columns: 1fr;
        }

        .illustration-box {
            width: 100%;
            height: 100%;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 1.5rem;
            border-right: 1px solid var(--border-color);
        }

        body.dark-mode .illustration-box {
            background-color: #0f172a;
        }

        .illustration-bg-blur {
            position: absolute;
            inset: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            object-fit: cover;
            filter: blur(24px) brightness(0.92);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.dark-mode .illustration-bg-blur {
            filter: blur(24px) brightness(0.5);
            opacity: 0.4;
        }

        .illustration-img {
            position: relative;
            z-index: 1;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: calc(100vh - 245px);
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.22);
            display: block;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .page-indicator-pill {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.78);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .story-content-area {
            padding: 2rem 2.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            max-height: calc(100vh - 205px);
        }

        .scene-header {
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
        }

        .scene-chapter-label {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .scene-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 0.15rem;
            line-height: 1.3;
        }

        .story-text-block {
            font-size: var(--base-font-size);
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .text-tetum {
            color: var(--text-main);
            font-weight: 500;
        }

        .text-english {
            color: var(--text-sub);
            font-size: 0.92em;
            padding-top: 0.9rem;
            border-top: 1px dashed var(--border-color);
        }

        .text-english.solo {
            color: var(--text-main);
            font-size: 1em;
            padding-top: 0;
            border-top: none;
        }

        /* 성경 인물 생각 정리 & 생활 적용 카드 스타일 */
        .reflection-card-wrap {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }

        .lesson-highlight {
            background-color: rgba(37, 99, 235, 0.08);
            border-left: 5px solid var(--primary-color);
            padding: 1.25rem 1.5rem;
            border-radius: 10px;
        }

        .question-highlight {
            background-color: rgba(234, 88, 12, 0.08);
            border: 2px dashed #ea580c;
            padding: 1.4rem 1.5rem;
            border-radius: 12px;
        }

        /* 하단 이전 / 다음 페이지 내비게이션 */
        .story-footer-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 2rem;
            background-color: var(--bg-body);
            border-top: 1px solid var(--border-color);
            gap: 1rem;
            flex-shrink: 0;
        }

        .nav-page-btn {
            padding: 0.6rem 1.25rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-paper);
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .nav-page-btn.primary {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .nav-page-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-dots {
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            background-color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-dot.active {
            width: 26px;
            border-radius: 999px;
            background-color: var(--primary-color);
        }

        footer {
            text-align: center;
            padding: 0.85rem;
            font-size: 0.78rem;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        @media screen and (max-width: 768px) {
            main {
                margin: 1rem auto;
                padding: 0 0.85rem;
            }
            .book-spread-layout {
                grid-template-columns: 1fr;
            }
            .illustration-box {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 1rem;
            }
            .illustration-img {
                max-height: 340px;
            }
            .story-content-area {
                padding: 1.35rem 1.2rem;
                max-height: none;
                justify-content: flex-start;
            }
            .story-footer-nav {
                padding: 0.85rem 1.2rem;
            }
            .scene-title {
                font-size: 1.2rem;
            }
            .nav-page-btn {
                padding: 0.55rem 1rem;
                font-size: 0.88rem;
            }
            .page-dots {
                display: none;
            }
        }

        /* ==========================================================================
           6. A4 인쇄용 워크북 전용 스타일 (@media print)
           ========================================================================== */
        #print-workbook {
            display: none;
        }

        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            header, .story-toolbar, main, footer {
                display: none !important;
            }
            #print-workbook {
                display: block !important;
                width: 100%;
                padding: 6mm 10mm;
            }
            .wb-header {
                border-bottom: 2px solid #000;
                padding-bottom: 6px;
                margin-bottom: 12px;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
            }
            .wb-header h1 {
                font-size: 16pt;
                font-weight: 800;
            }
            .wb-student-info {
                font-size: 10.5pt;
            }
            .wb-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                align-items: start;
            }
            .wb-coloring {
                border: 1.5px solid #222;
                border-radius: 8px;
                padding: 8px;
                text-align: center;
            }
            .wb-coloring img {
                width: 100%;
                max-height: 140mm;
                object-fit: contain;
            }
            .wb-puzzle-area {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .cw-table {
                border-collapse: collapse;
                margin: 0 auto;
            }
            .cw-table td {
                width: 23px;
                height: 23px;
                border: 1px solid #000;
                text-align: center;
                font-size: 9pt;
                font-weight: bold;
                position: relative;
            }
            .cw-table td.empty {
                border: none;
            }
            .cw-num {
                position: absolute;
                top: 1px;
                left: 2px;
                font-size: 6pt;
                font-weight: normal;
            }
            .clues-box {
                font-size: 9pt;
                line-height: 1.38;
            }
            .clues-box h4 {
                margin: 5px 0 2px;
                text-decoration: underline;
            }
            .wb-reflection {
                margin-top: 12px;
                border: 2px solid #000;
                border-radius: 8px;
                padding: 10px 12px;
            }
            .write-lines {
                margin-top: 8px;
                height: 25mm;
                background: repeating-linear-gradient(white, white 7.5mm, #888 7.8mm);
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="header-inner">
            <a href="index.html" class="brand-title">
                <img id="storyHeaderLogo" class="header-pub-logo" src="images/logo-s-j.png" alt="Editora Logo"
                     onerror="this.style.display='none';">
                <span id="headerBookTitle">Karrega hela istória...</span>
                <span class="brand-badge" id="headerBrandBadge">Istória</span>
            </a>
            <a href="index.html" class="back-library-btn">
                <i class="fa-solid fa-arrow-left"></i> Fila ba Biblioteka
            </a>
        </div>
    </header>

    <!-- 상단 컨트롤 툴바 -->
    <div class="story-toolbar">
        <div class="toolbar-inner">
            <div class="selector-group">
                <!-- 성경 인물 30선 모드일 때만 표시되는 인물 선택 드롭다운 -->
                <select id="characterSelect" class="scene-select char-select" style="display:none;" onchange="onCharacterSelectChange()" aria-label="Hili Ema iha Bíblia"></select>
                <!-- 장면(챕터) 바로가기 드롭다운 -->
                <select id="sceneSelect" class="scene-select" onchange="onSceneSelectChange()" aria-label="Hili Pájina"></select>
            </div>

            <!-- 언어 표시 모드 선택 -->
            <div class="lang-group" role="group" aria-label="Hili Lian">
                <button type="button" class="lang-btn active" data-lang="both" onclick="setLanguageMode('both')">Tetun + EN</button>
                <button type="button" class="lang-btn" data-lang="tet" onclick="setLanguageMode('tet')">Tetun</button>
                <button type="button" class="lang-btn" data-lang="en" onclick="setLanguageMode('en')">English</button>
            </div>

            <!-- 글자 크기, 야간 모드, 프레젠테이션 전체화면 & 워크북 인쇄 -->
            <div class="tools-group">
                <button type="button" class="tool-btn" onclick="changeFontSize(-2)" title="Hamenu Letra">A-</button>
                <button type="button" class="tool-btn" onclick="changeFontSize(2)" title="Haboot Letra">A+</button>
                <button type="button" class="tool-btn" id="darkModeBtn" onclick="toggleDarkMode()" title="Modu Kalan">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button type="button" class="tool-btn" id="fullscreenBtn" style="display:none;" onclick="toggleFullscreen()" title="Tela Tomak (Presentation)">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button type="button" class="tool-btn print-wb-btn" id="printWorkbookBtn" style="display:none;" onclick="window.print()" title="Imprime Atividade A4">
                    <i class="fa-solid fa-print"></i> Workbook
                </button>
            </div>
        </div>
    </div>

    <!-- 메인 동화책 뷰어 -->
    <main>
        <article class="story-book-card">
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>

            <div class="book-spread-layout" id="bookSpreadLayout">
                <!-- 왼쪽: 삽화 -->
                <div class="illustration-box" id="illustrationBox">
                    <img id="sceneBgBlur" class="illustration-bg-blur" src="" alt="" aria-hidden="true">
                    <span class="page-indicator-pill" id="pageIndicatorPill">Pájina 1</span>
                    <img id="sceneImage" class="illustration-img" src="" alt="Ilustrasaun Istória">
                </div>

                <!-- 오른쪽: 텍스트 -->
                <div class="story-content-area" id="storyContentArea">
                    <div class="scene-header">
                        <div class="scene-chapter-label" id="sceneChapterLabel">KAPÍTULU 1</div>
                        <h1 class="scene-title" id="sceneTitle">Karrega hela istória...</h1>
                    </div>

                    <div class="story-text-block" id="storyTextBlock"></div>
                </div>
            </div>

            <!-- 하단 이전/다음 페이지 버튼 -->
            <div class="story-footer-nav">
                <button type="button" class="nav-page-btn" id="prevPageBtn" onclick="moveScene(-1)">
                    <i class="fa-solid fa-chevron-left"></i> Uluk
                </button>

                <div class="page-dots" id="pageDots"></div>

                <button type="button" class="nav-page-btn primary" id="nextPageBtn" onclick="moveScene(1)">
                    Tuirmai <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </article>
    </main>

    <!-- A4 인쇄 전용 워크북 영역 -->
    <div id="print-workbook"></div>

    <footer>
        <p>&copy; 2026 Biblioteka Dijitál - SUE AND JUN Vocational Training Center (Timor-Leste).</p>
    </footer>

    <script>
        /* ==========================================================================
           [통합 리더 로직]
           1) 기존 동화책 모드: story.html?book=sheperd&pub=pub-3
           2) 성경 인물 30선 모드: story.html?bible=01_abraham&pub=pub-2
           ========================================================================== */
        const PUBLISHER_LOGOS = {
            "pub-0": "images/logo-Tiranu.jpeg",
            "pub-1": "images/logo-s-j.png",
            "pub-2": "images/logo-lafaek.png",
            "pub-3": "images/logo-siensia.png"
        };

        const IMAGE_FOLDER_OVERRIDES = {
            "lion_2": "lion"
        };

        const FALLBACK_STORY_DATA = {
            title: { en: "The Shepherd Boy & the Wolf", tet: "Bibi-atan Ki'ik ho Lobu" },
            scenes: [
                {
                    scene_number: 1,
                    title: "Bored in the Pasture",
                    image_file: "6.jpeg",
                    english_text: "A Shepherd Boy tended his master's sheep near a dark forest not far from the village.",
                    tetum_translation: "Iha bibi-atan ki'ik ida ne'ebé hein nia na'i nia bibi-malae sira iha du'ut fatin."
                }
            ]
        };

        let storyData = null;
        let renderSlides = []; // 실제 화면에 렌더링할 슬라이드 목록 (성경 인물은 마지막에 reflection 슬라이드 추가)
        let currentSceneIndex = 0;
        let currentLangMode = "both";
        let currentFontSize = 18;
        let isBibleMode = false;
        let bibleCharId = null;
        let bookSlug = "sheperd";

        function getPageConfig() {
            const params = new URLSearchParams(window.location.search);
            bibleCharId = params.get("bible");
            isBibleMode = Boolean(bibleCharId);

            if (isBibleMode) {
                return {
                    jsonPath: `data/bible_characters/${bibleCharId}.json`,
                    imageFolder: `images/bible/${bibleCharId}/`,
                    pubId: params.get("pub") || "pub-2"
                };
            } else {
                bookSlug = params.get("book") || "sheperd";
                const imgFolder = IMAGE_FOLDER_OVERRIDES[bookSlug] || bookSlug;
                return {
                    jsonPath: `data/res/stories-${bookSlug}.json`,
                    imageFolder: `images/${imgFolder}/`,
                    pubId: params.get("pub") || "pub-3"
                };
            }
        }

        function applyPublisherLogo(pubId) {
            const logoEl = document.getElementById("storyHeaderLogo");
            if (logoEl && PUBLISHER_LOGOS[pubId]) {
                logoEl.src = PUBLISHER_LOGOS[pubId];
            }
        }

        // 성경 인물 30명 드롭다운 로드
        async function loadBibleManifest() {
            const charSelect = document.getElementById("characterSelect");
            charSelect.style.display = "inline-block";
            document.getElementById("fullscreenBtn").style.display = "inline-flex";
            document.getElementById("printWorkbookBtn").style.display = "inline-flex";
            document.getElementById("headerBrandBadge").innerText = "Eskola Domingu";

            try {
                const res = await fetch("data/bible_characters/manifest.json");
                if (!res.ok) throw new Error("manifest.json 없음");
                const list = await res.json();
                charSelect.innerHTML = list.map(item =>
                    `<option value="${item.id}" ${item.id === bibleCharId ? "selected" : ""}>${item.id.split("_")[0]}. ${item.name_tet} (${item.name_en})</option>`
                ).join("");
            } catch (e) {
                charSelect.innerHTML = `<option value="${bibleCharId}">${bibleCharId}</option>`;
            }
        }

        function onCharacterSelectChange() {
            const nextId = document.getElementById("characterSelect").value;
            const pubId = new URLSearchParams(window.location.search).get("pub") || "pub-2";
            window.location.href = `story.html?bible=${nextId}&pub=${pubId}`;
        }

        async function loadStoryBook() {
            const config = getPageConfig();
            applyPublisherLogo(config.pubId);

            if (isBibleMode) {
                loadBibleManifest();
            }

            try {
                if (window.location.protocol === "blob:") {
                    throw new Error("Preview blob environment detected");
                }
                const response = await fetch(config.jsonPath);
                if (!response.ok) throw new Error(`JSON 파일을 찾을 수 없습니다: ${config.jsonPath}`);
                storyData = await response.json();
            } catch (err) {
                console.warn("외부 JSON 로드 실패:", err.message);
                storyData = FALLBACK_STORY_DATA;
            }

            // 제목 설정 (성경 인물 JSON vs 기존 동화 JSON 구조 모두 호환)
            const displayTitle = isBibleMode
                ? `${storyData.character_name_tet || storyData.character_name_en} (${storyData.bible_reference || ""})`
                : (storyData.title?.tet || storyData.title?.en || "Istória");

            document.title = `${displayTitle} - Biblioteka Dijitál`;
            document.getElementById("headerBookTitle").innerText = displayTitle;

            // 슬라이드 배열 구성
            renderSlides = (storyData.scenes || []).map(s => ({ ...s, isReflection: false }));
            if (isBibleMode && storyData.reflection) {
                renderSlides.push({
                    isReflection: true,
                    scene_number: renderSlides.length + 1,
                    title: "Hanoin no Halo Tuir (Think & Apply)",
                    reflection: storyData.reflection
                });
            }

            populateSceneControls();
            renderScene(0);

            if (isBibleMode) {
                buildWorkbookPrintArea(config.imageFolder);
            }
        }

        function populateSceneControls() {
            const selectEl = document.getElementById("sceneSelect");
            const dotsEl = document.getElementById("pageDots");

            selectEl.innerHTML = renderSlides.map((slide, idx) =>
                `<option value="${idx}">${slide.isReflection ? "💡" : slide.scene_number + "."} ${slide.title}</option>`
            ).join("");

            dotsEl.innerHTML = renderSlides.map((_, idx) =>
                `<button type="button" class="page-dot ${idx === 0 ? "active" : ""}" onclick="renderScene(${idx})" aria-label="Pájina ${idx + 1}"></button>`
            ).join("");
        }

        function renderScene(index) {
            if (!renderSlides || renderSlides.length === 0) return;

            const total = renderSlides.length;
            currentSceneIndex = Math.max(0, Math.min(total - 1, index));
            const slide = renderSlides[currentSceneIndex];
            const config = getPageConfig();

            const spreadLayout = document.getElementById("bookSpreadLayout");
            const illusBox = document.getElementById("illustrationBox");
            const textBlock = document.getElementById("storyTextBlock");

            document.getElementById("progressBarFill").style.width = `${((currentSceneIndex + 1) / total) * 100}%`;

            if (slide.isReflection) {
                // 마지막 슬라이드: 생각 정리 & 생활 적용 카드
                spreadLayout.classList.add("reflection-mode");
                illusBox.style.display = "none";

                document.getElementById("sceneChapterLabel").innerText = `REFLEXAUN • PÁJINA ${currentSceneIndex + 1} / ${total}`;
                document.getElementById("sceneTitle").innerText = "Hanoin no Halo Tuir";

                const ref = slide.reflection;
                const lessonHtml = currentLangMode === "en"
                    ? `<p class="text-english solo">📌 <b>Lesson:</b> ${ref.core_lesson_en}</p>`
                    : currentLangMode === "tet"
                    ? `<p class="text-tetum">📌 <b>Lisaun:</b> ${ref.core_lesson_tet}</p>`
                    : `<p class="text-tetum">📌 <b>Lisaun:</b> ${ref.core_lesson_tet}</p><p class="text-english">${ref.core_lesson_en}</p>`;

                const questionHtml = currentLangMode === "en"
                    ? `<p class="text-english solo" style="font-size:1.1em; font-weight:700;">❓ ${ref.discussion_question_en}</p>`
                    : currentLangMode === "tet"
                    ? `<p class="text-tetum" style="font-size:1.15em; font-weight:700;">❓ ${ref.discussion_question_tet}</p>`
                    : `<p class="text-tetum" style="font-size:1.15em; font-weight:700;">❓ ${ref.discussion_question_tet}</p><p class="text-english">${ref.discussion_question_en}</p>`;

                textBlock.innerHTML = `
                    <div class="reflection-card-wrap">
                        <div class="lesson-highlight">${lessonHtml}</div>
                        <div class="question-highlight">${questionHtml}</div>
                    </div>
                `;
            } else {
                // 일반 스토리 장면 (좌측 일러스트 + 우측 본문)
                spreadLayout.classList.remove("reflection-mode");
                illusBox.style.display = "flex";

                const imgEl = document.getElementById("sceneImage");
                const bgBlurEl = document.getElementById("sceneBgBlur");
                const fullImgPath = `${config.imageFolder}${slide.image_file}`;

                imgEl.src = fullImgPath;
                if (bgBlurEl) bgBlurEl.src = fullImgPath;
                imgEl.alt = slide.title;

                imgEl.onerror = function() {
                    this.onerror = null;
                    const fallbackUrl = `https://placehold.co/800x600/1e3a8a/ffffff?text=Kapitulu+${slide.scene_number}`;
                    this.src = fallbackUrl;
                    if (bgBlurEl) bgBlurEl.src = fallbackUrl;
                };

                document.getElementById("sceneChapterLabel").innerText = `KAPÍTULU ${slide.scene_number}`;
                document.getElementById("sceneTitle").innerText = slide.title;
                document.getElementById("pageIndicatorPill").innerText = `Pájina ${currentSceneIndex + 1} / ${total}`;

                if (currentLangMode === "tet") {
                    textBlock.innerHTML = `<p class="text-tetum">${slide.tetum_translation}</p>`;
                } else if (currentLangMode === "en") {
                    textBlock.innerHTML = `<p class="text-english solo">${slide.english_text}</p>`;
                } else {
                    textBlock.innerHTML = `
                        <p class="text-tetum">${slide.tetum_translation}</p>
                        <p class="text-english">${slide.english_text}</p>
                    `;
                }
            }

            const contentArea = document.getElementById("storyContentArea");
            if (contentArea) contentArea.scrollTop = 0;

            document.getElementById("sceneSelect").value = currentSceneIndex;
            document.querySelectorAll(".page-dot").forEach((dot, idx) => {
                dot.classList.toggle("active", idx === currentSceneIndex);
            });

            document.getElementById("prevPageBtn").disabled = (currentSceneIndex === 0);

            const nextBtn = document.getElementById("nextPageBtn");
            if (currentSceneIndex === total - 1) {
                nextBtn.innerHTML = `<i class="fa-solid fa-rotate-left"></i> Lee Fali`;
                nextBtn.onclick = () => renderScene(0);
            } else {
                nextBtn.innerHTML = `Tuirmai <i class="fa-solid fa-chevron-right"></i>`;
                nextBtn.onclick = () => moveScene(1);
            }
        }

        function moveScene(step) {
            renderScene(currentSceneIndex + step);
            if (window.innerWidth <= 768) {
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        function onSceneSelectChange() {
            renderScene(Number(document.getElementById("sceneSelect").value));
        }

        function setLanguageMode(mode) {
            currentLangMode = mode;
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === mode);
            });
            renderScene(currentSceneIndex);
        }

        function changeFontSize(step) {
            currentFontSize = Math.min(28, Math.max(14, currentFontSize + step));
            document.documentElement.style.setProperty("--base-font-size", `${currentFontSize}px`);
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            document.getElementById("darkModeBtn").innerHTML = isDark
                ? `<i class="fa-solid fa-sun"></i>`
                : `<i class="fa-solid fa-moon"></i>`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        /* ==========================================================================
           [A4 워크북 인쇄용 크로스워드 퍼즐 생성 및 조판 로직]
           ========================================================================== */
        function generateCrosswordGrid(wordsList) {
            const cleanWords = wordsList
                .map((w, idx) => ({
                    word: (w.word_tet || w.word_en || "").toUpperCase().replace(/[^A-Z]/g, ""),
                    clue: w.clue_tet || w.clue_en || "",
                    origIdx: idx + 1
                }))
                .filter(w => w.word.length >= 2)
                .sort((a, b) => b.word.length - a.word.length);

            const size = 14;
            const grid = Array.from({ length: size }, () => Array(size).fill(null));
            const placed = [];

            if (cleanWords.length === 0) return { grid, placed, size };

            const first = cleanWords[0];
            const startCol = Math.max(0, Math.floor((size - first.word.length) / 2));
            const startRow = Math.floor(size / 2);
            for (let i = 0; i < first.word.length; i++) {
                grid[startRow][startCol + i] = first.word[i];
            }
            placed.push({ ...first, row: startRow, col: startCol, dir: "across", num: 1 });

            let wordNum = 2;
            for (let wIdx = 1; wIdx < cleanWords.length; wIdx++) {
                const current = cleanWords[wIdx];
                let isPlaced = false;

                for (let r = 0; r < size && !isPlaced; r++) {
                    for (let c = 0; c < size && !isPlaced; c++) {
                        const cellChar = grid[r][c];
                        if (!cellChar) continue;

                        for (let i = 0; i < current.word.length; i++) {
                            if (current.word[i] === cellChar) {
                                // 세로 배치 검사
                                const rStart = r - i;
                                if (rStart >= 0 && rStart + current.word.length <= size) {
                                    let ok = true;
                                    for (let k = 0; k < current.word.length; k++) {
                                        const existing = grid[rStart + k][c];
                                        if (existing && existing !== current.word[k]) { ok = false; break; }
                                        if (!existing) {
                                            if ((c > 0 && grid[rStart + k][c - 1]) || (c < size - 1 && grid[rStart + k][c + 1])) { ok = false; break; }
                                        }
                                    }
                                    if ((rStart > 0 && grid[rStart - 1][c]) || (rStart + current.word.length < size && grid[rStart + current.word.length][c])) ok = false;

                                    if (ok) {
                                        for (let k = 0; k < current.word.length; k++) grid[rStart + k][c] = current.word[k];
                                        placed.push({ ...current, row: rStart, col: c, dir: "down", num: wordNum++ });
                                        isPlaced = true;
                                        break;
                                    }
                                }
                                // 가로 배치 검사
                                const cStart = c - i;
                                if (!isPlaced && cStart >= 0 && cStart + current.word.length <= size) {
                                    let ok = true;
                                    for (let k = 0; k < current.word.length; k++) {
                                        const existing = grid[r][cStart + k];
                                        if (existing && existing !== current.word[k]) { ok = false; break; }
                                        if (!existing) {
                                            if ((r > 0 && grid[r - 1][cStart + k]) || (r < size - 1 && grid[r + 1][cStart + k])) { ok = false; break; }
                                        }
                                    }
                                    if ((cStart > 0 && grid[r][cStart - 1]) || (cStart + current.word.length < size && grid[r][cStart + current.word.length])) ok = false;

                                    if (ok) {
                                        for (let k = 0; k < current.word.length; k++) grid[r][cStart + k] = current.word[k];
                                        placed.push({ ...current, row: r, col: cStart, dir: "across", num: wordNum++ });
                                        isPlaced = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return { grid, placed, size };
        }

        function buildWorkbookPrintArea(imageFolder) {
            const wb = storyData.workbook || {};
            const ref = storyData.reflection || {};
            const coloringFile = (wb.coloring_page && wb.coloring_page.image_file) || "coloring.jpeg";
            const coloringPath = `${imageFolder}${coloringFile}`;
            const { grid, placed, size } = generateCrosswordGrid(wb.crossword_words || []);

            const numMap = {};
            placed.forEach(p => { numMap[`${p.row},${p.col}`] = p.num; });

            let minR = size, maxR = 0, minC = size, maxC = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c]) {
                        if (r < minR) minR = r;
                        if (r > maxR) maxR = r;
                        if (c < minC) minC = c;
                        if (c > maxC) maxC = c;
                    }
                }
            }

            let tableHtml = `<table class="cw-table">`;
            if (placed.length > 0) {
                for (let r = minR; r <= maxR; r++) {
                    tableHtml += "<tr>";
                    for (let c = minC; c <= maxC; c++) {
                        if (grid[r][c]) {
                            const num = numMap[`${r},${c}`] ? `<span class="cw-num">${numMap[`${r},${c}`]}</span>` : "";
                            tableHtml += `<td>${num}</td>`;
                        } else {
                            tableHtml += `<td class="empty"></td>`;
                        }
                    }
                    tableHtml += "</tr>";
                }
            }
            tableHtml += "</table>";

            const acrossClues = placed.filter(p => p.dir === "across").map(p => `<div><b>${p.num}.</b> ${p.clue} (${p.word.length})</div>`).join("");
            const downClues = placed.filter(p => p.dir === "down").map(p => `<div><b>${p.num}.</b> ${p.clue} (${p.word.length})</div>`).join("");

            document.getElementById("print-workbook").innerHTML = `
                <div class="wb-header">
                    <div>
                        <h1>Atividade Eskola Domingu: ${storyData.character_name_tet || storyData.character_name_en}</h1>
                        <small>${storyData.bible_reference || ""}</small>
                    </div>
                    <div class="wb-student-info">Naran: ______________________ &nbsp; Data: ____________</div>
                </div>

                <div class="wb-grid">
                    <div class="wb-coloring">
                        <div style="font-weight:bold; margin-bottom:5px;">🎨 Pinta Imajen (Coloring)</div>
                        <img src="${coloringPath}" alt="Coloring Page">
                    </div>

                    <div class="wb-puzzle-area">
                        <div style="font-weight:bold; text-align:center;">🧩 Liafuan Kruzadu (Crossword)</div>
                        ${tableHtml}
                        <div class="clues-box">
                            <h4>➡️ Husi Karuk ba Loos (Across)</h4>
                            ${acrossClues || "<div>-</div>"}
                            <h4>⬇️ Husi Leten ba Kraik (Down)</h4>
                            ${downClues || "<div>-</div>"}
                        </div>
                    </div>
                </div>

                <div class="wb-reflection">
                    <div style="font-weight:bold;">✍️ Hanoin no Halo Tuir:</div>
                    <div style="margin-top:4px; font-size:10.5pt;">${ref.discussion_question_tet || ""}</div>
                    <div class="write-lines"></div>
                </div>
            `;
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && currentSceneIndex > 0) moveScene(-1);
            if (e.key === "ArrowRight" && renderSlides && currentSceneIndex < renderSlides.length - 1) moveScene(1);
        });

        window.addEventListener("DOMContentLoaded", loadStoryBook);
    </script>
</body>
</html>
