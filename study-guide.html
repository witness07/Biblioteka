<!DOCTYPE html>
<html lang="tet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudu Bíblia - Livru Kiik 10 (Chapel Library)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-desk: #ECE8E0;
      --bg-card: #FFFDF9;
      --bg-soft: #F6F1E8;
      --bg-prayer: #F2ECE1;
      --navy: #1E293B;
      --gold: #8B5E34;
      --gold-border: #D8C5AE;
      --text-main: #1F2937;
      --text-muted: #64748B;
      --border: #E2DBD0;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Merriweather', Georgia, serif;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-desk);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    .topbar {
      background: #FFFDF9;
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      flex-shrink: 0;
      z-index: 50;
    }

    .topbar-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      flex: 1;
    }

    .btn-pill {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--navy);
      padding: 0.34rem 0.65rem;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .btn-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-pill.accent {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .btn-pill.accent:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #FFFFFF;
    }

    .book-select {
      border: 1px solid var(--gold-border);
      background: var(--bg-soft);
      color: var(--navy);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.36rem 0.65rem;
      border-radius: 7px;
      max-width: 440px;
      width: 100%;
      cursor: pointer;
      outline: none;
    }

    .book-select:focus {
      border-color: var(--gold);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* Font Size Control Group */
    .font-size-group {
      display: inline-flex;
      align-items: center;
      background: #E8E1D5;
      padding: 2px;
      border-radius: 7px;
      gap: 2px;
    }

    .font-btn {
      border: none;
      background: transparent;
      color: var(--navy);
      padding: 0.26rem 0.52rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .font-btn:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .font-btn.active {
      background: #FFFFFF;
      color: var(--gold);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .font-scale-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.25rem;
      min-width: 2.6rem;
      text-align: center;
    }

    /* Single-Language Toggle (Tetun default / English) */
    .lang-toggle {
      display: inline-flex;
      background: #E8E1D5;
      padding: 2px;
      border-radius: 7px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 0.28rem 0.68rem;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background: #FFFFFF;
      color: var(--navy);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* Main Viewport Stage */
    .stage {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 0.6rem 0.9rem 0.7rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 2-Page Split Spread Container */
    .spread-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      animation: fadeSpread 0.2s ease;
    }

    @keyframes fadeSpread {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-pane {
      padding: 1rem 1.25rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      overflow-y: auto;
    }

    .page-pane.left-page {
      border-right: 1px solid var(--border);
      background: #FFFDF9;
    }

    .page-pane.right-page {
      background: #FCF9F3;
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
      margin-bottom: 0.65rem;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .book-badge {
      background: var(--navy);
      color: #FFFFFF;
      font-size: calc(0.7rem * var(--font-scale));
      font-weight: 700;
      padding: 0.18rem 0.52rem;
      border-radius: 5px;
      letter-spacing: 0.03em;
    }

    .page-badge {
      background: var(--bg-soft);
      color: var(--gold);
      border: 1px solid var(--gold-border);
      font-size: calc(0.7rem * var(--font-scale));
      font-weight: 700;
      padding: 0.16rem 0.5rem;
      border-radius: 5px;
    }

    .author-tag {
      font-size: calc(0.76rem * var(--font-scale));
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Page 1 Body (Left Pane) */
    .p1-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.75rem;
    }

    .p1-top-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cover-frame {
      width: 126px;
      flex-shrink: 0;
      aspect-ratio: 1.4 / 1.6;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      background: var(--navy);
    }

    .cover-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .p1-title-block {
      min-width: 0;
    }

    .book-main-title {
      font-family: var(--font-serif);
      font-size: calc(1.24rem * var(--font-scale));
      line-height: 1.28;
      color: var(--navy);
      margin-bottom: 0.25rem;
    }

    .book-sub-author {
      font-size: calc(0.86rem * var(--font-scale));
      font-weight: 600;
      color: var(--gold);
    }

    .summary-box {
      background: var(--bg-soft);
      border-left: 4px solid var(--gold);
      border-radius: 0 8px 8px 0;
      padding: 0.78rem 0.95rem;
      font-size: calc(0.86rem * var(--font-scale));
      line-height: 1.58;
      color: var(--text-main);
    }

    body.lang-en .summary-box {
      font-family: var(--font-serif);
      font-size: calc(0.83rem * var(--font-scale));
    }

    /* Page 2 Body (Right Pane) */
    .p2-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.52rem;
    }

    .section-label {
      font-size: calc(0.72rem * var(--font-scale));
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gold);
      margin-bottom: 0.22rem;
    }

    .scripture-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.38rem;
    }

    .scripture-card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 6px;
      padding: 0.38rem 0.55rem;
      transition: all 0.16s ease;
    }

    .scripture-card:hover {
      border-color: var(--gold);
      background: #F1E9DC;
    }

    .scripture-ref-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-sans);
      font-size: calc(0.75rem * var(--font-scale));
      font-weight: 700;
      color: var(--gold);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: underline;
      text-underline-offset: 2px;
      margin-bottom: 0.1rem;
    }

    .scripture-ref-btn:hover {
      color: var(--navy);
    }

    .scripture-verse-text {
      font-size: calc(0.73rem * var(--font-scale));
      line-height: 1.36;
      color: var(--text-main);
    }

    body.lang-en .scripture-verse-text {
      font-family: var(--font-serif);
      font-size: calc(0.71rem * var(--font-scale));
    }

    .question-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }

    .question-item {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.32rem 0.55rem;
      font-size: calc(0.74rem * var(--font-scale));
      line-height: 1.36;
      display: flex;
      gap: 0.38rem;
      align-items: flex-start;
    }

    .q-num {
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0;
    }

    .prayer-box {
      margin-top: auto;
      background: var(--bg-prayer);
      border: 1px solid var(--gold-border);
      border-radius: 6px;
      padding: 0.42rem 0.62rem;
    }

    .prayer-title {
      font-size: calc(0.68rem * var(--font-scale));
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gold);
      margin-bottom: 0.1rem;
    }

    .prayer-text {
      font-size: calc(0.72rem * var(--font-scale));
      line-height: 1.36;
      color: var(--navy);
      font-style: italic;
    }

    .pane-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border);
      padding-top: 0.32rem;
      margin-top: 0.45rem;
      font-size: calc(0.7rem * var(--font-scale));
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Inline Bible Drawer */
    .bible-inline-panel {
      max-width: 1360px;
      width: 100%;
      margin: 0 auto 0.9rem;
      padding: 0 0.9rem;
      display: none;
    }

    .bible-inline-panel.open {
      display: block;
    }

    .bible-panel-box {
      background: #FFFFFF;
      border: 2px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
      overflow: hidden;
    }

    .bible-panel-bar {
      background: var(--navy);
      color: #FFFFFF;
      padding: 0.55rem 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .bible-panel-title {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .return-guide-btn {
      background: #D4A373;
      color: var(--navy);
      border: none;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .return-guide-btn:hover {
      background: #E5B98A;
    }

    .bible-iframe {
      width: 100%;
      height: 430px;
      border: none;
      display: block;
      background: #F8FAFC;
    }

    /* Desktop Zero-Scroll Viewport Fit (>= 980px) */
    @media (min-width: 980px) {
      body:not(.bible-open) {
        height: 100vh;
        overflow: hidden;
      }

      body:not(.bible-open) .stage {
        overflow: hidden;
      }
    }

    /* Tablet & Mobile Stack */
    @media (max-width: 979px) {
      .spread-card {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .page-pane {
        overflow-y: visible;
      }

      .page-pane.left-page {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .scripture-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Print / Save as PDF Styles */
    #printSpreadView {
      display: none;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      html,
      body {
        background: #FFFFFF !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        display: block !important;
      }

      .topbar,
      .bible-inline-panel,
      #singleSpreadView {
        display: none !important;
      }

      #printSpreadView {
        display: block !important;
        width: 100% !important;
        visibility: visible !important;
      }

      .print-spread-page {
        page-break-after: always;
        break-after: page;
        margin-bottom: 6mm;
      }

      .print-spread-page:last-child {
        page-break-after: auto;
        break-after: auto;
        margin-bottom: 0;
      }

      .print-spread-page .spread-card {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        overflow: visible !important;
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        min-height: 182mm;
        animation: none !important;
      }

      .print-spread-page .page-pane {
        overflow: visible !important;
      }
    }
  </style>
</head>
<body class="lang-tet">

  <!-- Top Toolbar -->
  <header class="topbar" id="topGuideAnchor">
    <div class="topbar-inner">
      <div class="left-controls">
        <a href="index.html" class="btn-pill">← Biblioteka</a>
        <select id="bookDropdown" class="book-select" aria-label="Hili Livru Estudu"></select>
      </div>

      <div class="right-controls">
        <!-- Font Size Controls -->
        <div class="font-size-group" role="group" aria-label="Font size controls">
          <button type="button" class="font-btn" id="fontDecreaseBtn" title="Hamenus letra (A-)">A-</button>
          <span class="font-scale-label" id="fontScaleLabel">100%</span>
          <button type="button" class="font-btn" id="fontIncreaseBtn" title="Aumenta letra (A+)">A+</button>
          <button type="button" class="font-btn" id="fontResetBtn" title="Normal (100%)">↺</button>
        </div>

        <!-- Single Language Switcher (Tetun default / English) -->
        <div class="lang-toggle" role="group" aria-label="Language toggle">
          <button type="button" class="lang-btn active" data-lang="tet">Tetun</button>
          <button type="button" class="lang-btn" data-lang="en">English</button>
        </div>

        <button type="button" class="btn-pill accent" id="printAllBtn" title="Rai Livru 1–10 Hotu nu'udar PDF">📄 PDF 1–10 Hotu</button>
      </div>
    </div>
  </header>

  <!-- Main Single-Screen 2-Page Spread -->
  <main class="stage" id="singleSpreadView">
    <section class="spread-card" id="spreadContainer">
      <div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:#64748B;">Karrega hela matéria estudu Bíblia...</div>
    </section>
  </main>

  <!-- Inline Bible Viewer Panel -->
  <section class="bible-inline-panel" id="bibleInlinePanel" aria-label="Bíblia Tetun">
    <div class="bible-panel-box">
      <div class="bible-panel-bar">
        <span class="bible-panel-title" id="biblePanelTitle">📖 Bíblia Tetun</span>
        <button type="button" class="return-guide-btn" id="returnToGuideBtn">↑ Fila fali ba Estudu</button>
      </div>
      <iframe id="bibleIframe" class="bible-iframe" src="about:blank" title="Bíblia Tetun"></iframe>
    </div>
  </section>

  <!-- Hidden Print Container for Clean PDF Export -->
  <div id="printSpreadView"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const initialBookParam = parseInt(params.get('book'), 10);

      let guidesData = [];
      let currentBookIndex = 0; // 0 to 9 (Book #1 to #10)
      let currentLang = 'tet';  // 'tet' default, 'en' toggle
      let fontScale = 1.0;      // 0.85 to 1.35 step 0.05

      const bookDropdown = document.getElementById('bookDropdown');
      const spreadContainer = document.getElementById('spreadContainer');
      const bibleInlinePanel = document.getElementById('bibleInlinePanel');
      const biblePanelTitle = document.getElementById('biblePanelTitle');
      const bibleIframe = document.getElementById('bibleIframe');
      const printSpreadView = document.getElementById('printSpreadView');
      const fontScaleLabel = document.getElementById('fontScaleLabel');

      function applyFontScale(nextScale) {
        fontScale = Math.min(1.35, Math.max(0.85, Math.round(nextScale * 100) / 100));
        document.documentElement.style.setProperty('--font-scale', fontScale.toFixed(2));
        fontScaleLabel.textContent = `${Math.round(fontScale * 100)}%`;
      }

      document.getElementById('fontDecreaseBtn').addEventListener('click', () => {
        applyFontScale(fontScale - 0.05);
      });

      document.getElementById('fontIncreaseBtn').addEventListener('click', () => {
        applyFontScale(fontScale + 0.05);
      });

      document.getElementById('fontResetBtn').addEventListener('click', () => {
        applyFontScale(1.0);
      });

      // Language Switcher
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          document.body.classList.remove('lang-tet', 'lang-en');
          document.body.classList.add(`lang-${currentLang}`);
          populateDropdown();
          renderSpread();
        });
      });

      function populateDropdown() {
        const isTet = currentLang === 'tet';
        bookDropdown.innerHTML = '';
        guidesData.forEach((item, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          const title = isTet ? item.title_tet : item.title_en;
          opt.textContent = `Livru #${String(item.book_id).padStart(2, '0')} — ${title} (${item.author})`;
          bookDropdown.appendChild(opt);
        });
        bookDropdown.value = currentBookIndex;
      }

      bookDropdown.addEventListener('change', (e) => {
        currentBookIndex = parseInt(e.target.value, 10) || 0;
        closeBiblePanel();
        renderSpread();
      });

      // Open bible.html directly below when a Scripture reference is clicked
      window.openBibleVerse = function (refCode, labelText) {
        biblePanelTitle.textContent = `📖 Bíblia Tetun — ${labelText}`;
        bibleIframe.src = `bible.html?ref=${encodeURIComponent(refCode)}`;
        bibleInlinePanel.classList.add('open');
        document.body.classList.add('bible-open');
        setTimeout(() => {
          bibleInlinePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      };

      function closeBiblePanel() {
        bibleInlinePanel.classList.remove('open');
        document.body.classList.remove('bible-open');
        bibleIframe.src = 'about:blank';
      }

      document.getElementById('returnToGuideBtn').addEventListener('click', () => {
        closeBiblePanel();
        document.getElementById('topGuideAnchor').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      function escapeJsAttr(str) {
        return String(str)
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/"/g, '&quot;');
      }

      function buildSpreadInnerHtml(book, isTet) {
        const title = isTet ? book.title_tet : book.title_en;
        const summary = isTet ? book.page1.summary_tet : book.page1.summary_en;
        const questions = isTet ? book.page2.questions_tet : book.page2.questions_en;
        const prayer = isTet ? book.page2.prayer_tet : book.page2.prayer_en;
        const bookNum = String(book.book_id).padStart(2, '0');

        const scripturesHtml = book.page2.scriptures.map(s => {
          const label = isTet ? s.label_tet : s.label_en;
          const text = isTet ? s.text_tet : s.text_en;
          return `
            <div class="scripture-card">
              <button type="button" class="scripture-ref-btn" onclick="openBibleVerse('${escapeJsAttr(s.ref_code)}', '${escapeJsAttr(label)}')">
                📖 ${label}
              </button>
              <div class="scripture-verse-text">${text}</div>
            </div>
          `;
        }).join('');

        const questionsHtml = questions.map((q, idx) => `
          <li class="question-item">
            <span class="q-num">${idx + 1}.</span>
            <span>${q}</span>
          </li>
        `).join('');

        return `
          <!-- LEFT: PAGE 1 (Book Info & Summary) -->
          <div class="page-pane left-page">
            <div class="pane-header">
              <div class="badge-group">
                <span class="book-badge">${isTet ? 'Livru' : 'Book'} #${bookNum} / 10</span>
                <span class="page-badge">Page 1 · ${isTet ? 'Rezumu Livru' : 'Book Overview'}</span>
              </div>
              <span class="author-tag">${book.author}</span>
            </div>

            <div class="p1-body">
              <div class="p1-top-row">
                <div class="cover-frame">
                  <img src="${book.cover_image}" alt="${title}" onerror="this.src='https://placehold.co/280x320/1e293b/ffffff?text=Livru+%23${bookNum}';" />
                </div>
                <div class="p1-title-block">
                  <h1 class="book-main-title">${title}</h1>
                  <p class="book-sub-author">${isTet ? 'Hakerek-nain:' : 'Author:'} ${book.author}</p>
                </div>
              </div>

              <div class="summary-box">${summary}</div>
            </div>

            <div class="pane-footer">
              <span>Biblioteka ba Kristaun · Estudu Bíblia</span>
              <span>Page 1</span>
            </div>
          </div>

          <!-- RIGHT: PAGE 2 (Scriptures, Questions & Prayer) -->
          <div class="page-pane right-page">
            <div class="pane-header">
              <div class="badge-group">
                <span class="page-badge">Page 2 · ${isTet ? 'Estudu Bíblia' : 'Bible Study'}</span>
                <span style="font-size:calc(0.74rem * var(--font-scale)); font-weight:600; color:var(--navy);">${title}</span>
              </div>
              <span class="author-tag">${isTet ? 'Klik versíkulu ba Bíblia' : 'Click verse for Bible'}</span>
            </div>

            <div class="p2-body">
              <div>
                <div class="section-label">${isTet ? 'Versíkulu Bíblia' : 'Scripture Passages'}</div>
                <div class="scripture-grid">${scripturesHtml}</div>
              </div>

              <div>
                <div class="section-label">${isTet ? 'Pergunta Estudu Bíblia' : 'Bible Study Questions'}</div>
                <ul class="question-list">${questionsHtml}</ul>
              </div>

              <div class="prayer-box">
                <div class="prayer-title">🙏 ${isTet ? 'Orasaun Aplikasaun' : 'Prayer of Application'}</div>
                <div class="prayer-text">${prayer}</div>
              </div>
            </div>

            <div class="pane-footer">
              <span>Livru #${bookNum} (${book.author})</span>
              <span>Page 2</span>
            </div>
          </div>
        `;
      }

      function renderSpread() {
        if (!guidesData.length) return;
        const book = guidesData[currentBookIndex];
        const isTet = currentLang === 'tet';
        spreadContainer.innerHTML = buildSpreadInnerHtml(book, isTet);
      }

      function renderPrintAllPages() {
        if (!guidesData.length) return;
        const isTet = currentLang === 'tet';
        printSpreadView.innerHTML = guidesData.map(b => `
          <div class="print-spread-page">
            <div class="spread-card">${buildSpreadInnerHtml(b, isTet)}</div>
          </div>
        `).join('');
      }

      // Keep #printSpreadView synced before print preview
      window.addEventListener('beforeprint', () => {
        renderPrintAllPages();
      });

      document.getElementById('printAllBtn').addEventListener('click', () => {
        if (!guidesData.length) return;
        renderPrintAllPages();
        window.print();
      });

      // Load study_guides.json
      fetch('data/res/study_guides.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          guidesData = data;
          if (!isNaN(initialBookParam) && initialBookParam >= 1 && initialBookParam <= guidesData.length) {
            currentBookIndex = initialBookParam - 1;
          }
          populateDropdown();
          renderSpread();
          renderPrintAllPages();
        })
        .catch(() => {
          fetch('study_guides.json')
            .then(r => r.json())
            .then(data => {
              guidesData = data;
              populateDropdown();
              renderSpread();
              renderPrintAllPages();
            })
            .catch(err => {
              spreadContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:#B91C1C;">Dadus la hetan (${err.message}). Tau file <strong>study_guides.json</strong> iha pasta <code>data/res/</code> laran.</div>`;
            });
        });
    })();
  </script>
</body>
</html>
